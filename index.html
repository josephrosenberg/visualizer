<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetosphere Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    canvas { display: block; }

    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      transition: opacity 1.0s;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #start-panel {
      text-align: center;
      max-width: 520px;
      padding: 40px;
    }

    #start-panel h1 {
      font-size: 24px;
      font-weight: 200;
      margin-bottom: 8px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    #start-panel .sub {
      font-size: 11px;
      color: #555;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    #start-panel p {
      font-size: 13px;
      color: #777;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      padding: 13px 32px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      margin: 5px;
    }

    .btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }

    .btn.primary {
      background: rgba(100, 130, 255, 0.15);
      border-color: rgba(100, 130, 255, 0.4);
      color: #aac;
    }

    .btn.primary:hover {
      background: rgba(100, 130, 255, 0.3);
      color: #fff;
    }

    .keys {
      margin-top: 24px;
      font-size: 11px;
      color: #444;
      line-height: 2;
    }

    .keys kbd {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
      color: #888;
      margin: 0 1px;
    }

    #info {
      position: fixed;
      top: 14px;
      right: 14px;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      z-index: 50;
      text-align: right;
      line-height: 1.8;
      letter-spacing: 1px;
      transition: opacity 0.5s;
    }

    #file-input { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="start-panel">
      <h1>Magnetosphere</h1>
      <div class="sub">Music Visualizer</div>
      <p>
        Metallic spheres orbit each other while charged particles
        stream along magnetic field lines, reacting to every frequency in the music.
      </p>
      <button class="btn primary" id="btn-capture">Capture System Audio</button>
      <button class="btn" id="btn-file">Load Audio File</button>
      <button class="btn" id="btn-demo">Demo Mode</button>
      <input type="file" id="file-input" accept="audio/*">
      <div class="keys">
        <kbd>M</kbd> mode &nbsp;
        <kbd>P</kbd> palette &nbsp;
        <kbd>F</kbd> freeze &nbsp;
        <kbd>N</kbd> nebula &nbsp;
        <kbd>A</kbd>/<kbd>S</kbd> particles
      </div>
    </div>
  </div>

  <div id="info">
    <div id="info-text"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="visualizer.js"></script>
</body>
</html>
